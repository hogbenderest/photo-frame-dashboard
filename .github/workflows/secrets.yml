# Mandatory secrets gate, installed 2026-10-24 after a leaked-token incident.
# Local gates live in ~/.git-hooks (pre-commit, pre-push). This workflow is the
# server-side backstop: full-history gitleaks scan on every push and PR.
name: secrets

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
